<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Vivid BanG Dream! Star Gradient -->
    <linearGradient id="orbStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff528c" />
      <stop offset="45%" stop-color="#ff2d75" />
      <stop offset="100%" stop-color="#b80043" />
    </linearGradient>

    <!-- Golden Highlight -->
    <linearGradient id="orbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Cyan/Violet Stage Beam Gradient -->
    <linearGradient id="orbBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff2d75" />
    </linearGradient>

    <!-- Glow -->
    <filter id="orbGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#ff2d75" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#orbGlow)">
    <!-- Back Orbital Groove Arc -->
    <path
      d="M 22,64 C 18,48 34,32 58,26 C 82,20 102,26 106,42"
      stroke="url(#orbBeamGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Main BanG Dream! Faceted Stage Prism Star (Tilted dynamically at -8 deg, center 60, 58) -->
    <g transform="translate(60, 58) rotate(-8)">
      <!-- Outer Star Body -->
      <polygon
        points="0,-48 13,-15 48,-12 22,14 31,48 0,30 -31,48 -22,14 -48,-12 -13,-15"
        fill="url(#orbStarGrad)"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linejoin="round"
      />

      <!-- Facet 3D Diamond Cuts -->
      <polygon points="0,-48 0,0 48,-12" fill="#ffffff" opacity="0.35" />
      <polygon points="48,-12 0,0 22,14" fill="#000000" opacity="0.15" />
      <polygon points="22,14 0,0 31,48" fill="#ffffff" opacity="0.25" />
      <polygon points="31,48 0,0 0,30" fill="#000000" opacity="0.2" />
      <polygon points="0,30 0,0 -31,48" fill="#ffffff" opacity="0.2" />
      <polygon points="-31,48 0,0 -22,14" fill="#000000" opacity="0.25" />
      <polygon points="-22,14 0,0 -48,-12" fill="#ffffff" opacity="0.3" />
      <polygon points="-48,-12 0,0 -13,-15" fill="#000000" opacity="0.1" />
      <polygon points="-13,-15 0,0 0,-48" fill="#ffffff" opacity="0.45" />

      <!-- Inner Core Shimmer Star -->
      <polygon
        points="0,-22 6,-7 22,-5 10,6 14,22 0,14 -14,22 -10,6 -22,-5 -6,-7"
        fill="url(#orbGoldGrad)"
        opacity="0.9"
      />
      <!-- Center Crystal Gem -->
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    </g>

    <!-- Front Orbital Low-End Groove Wave (Swooping across front of the star) -->
    <path
      d="M 106,42 C 110,58 96,80 66,92 C 40,102 18,96 14,80"
      stroke="url(#orbBeamGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Twin Twinkling Starlight Satellites -->
    <g transform="translate(105, 38)">
      <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.8" fill="#ff2d75" />
    </g>

    <g transform="translate(15, 82) scale(0.75)">
      <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.8" fill="#38bdf8" />
    </g>
  </g>
</svg>
